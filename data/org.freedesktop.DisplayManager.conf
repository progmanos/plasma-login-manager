<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root can own the service or call privileged interfaces -->
  <policy user="root">
    <allow own="org.freedesktop.DisplayManager"/>
    <allow own="org.kde.DisplayManager"/>
    <allow send_destination="org.freedesktop.DisplayManager" send_interface="org.freedesktop.DisplayManager" send_member="AddSeat"/>
    <!-- Only the system-level RDP dispatcher (running as root) may create/stop remote displays -->
    <allow send_destination="org.freedesktop.DisplayManager" send_interface="org.kde.DisplayManager.RemoteDisplayFactory"/>
    <allow send_destination="org.kde.DisplayManager" send_interface="org.kde.DisplayManager.RemoteDisplayFactory"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.freedesktop.DisplayManager" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.freedesktop.DisplayManager" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.DisplayManager" send_interface="org.freedesktop.DisplayManager"/>
    <allow send_destination="org.freedesktop.DisplayManager" send_interface="org.freedesktop.DisplayManager.Seat"/>
    <allow send_destination="org.freedesktop.DisplayManager" send_interface="org.freedesktop.DisplayManager.Session"/>
    <allow send_destination="org.kde.DisplayManager" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.kde.DisplayManager" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.kde.DisplayManager" send_interface="org.freedesktop.DisplayManager"/>
    <deny send_destination="org.freedesktop.DisplayManager" send_interface="org.freedesktop.DisplayManager" send_member="AddSeat"/>
    <!-- Unprivileged callers must not be able to create or destroy remote display sessions -->
    <deny send_destination="org.freedesktop.DisplayManager" send_interface="org.kde.DisplayManager.RemoteDisplayFactory"/>
    <deny send_destination="org.kde.DisplayManager" send_interface="org.kde.DisplayManager.RemoteDisplayFactory"/>
  </policy>

</busconfig>
